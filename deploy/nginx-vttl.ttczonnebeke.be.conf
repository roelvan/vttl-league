# /etc/nginx/sites-available/vttl.ttczonnebeke.be
# certbot --nginx adds the listen 443 / certificate lines and the HTTP -> HTTPS redirect.
map $http_upgrade $vl_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name vttl.ttczonnebeke.be;

    client_max_body_size 2m;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # /api/ws: live sheet changes. Long timeout so idle sockets stay open.
    location /api/ws {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vl_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
