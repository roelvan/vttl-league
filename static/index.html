<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VTTL League</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    .layout { display: grid; grid-template-columns: 18rem 1fr; min-height: 100vh; }
    aside { border-right: 1px solid #ccc; padding: 1rem; }
    main { padding: 1rem; overflow-x: auto; }
    aside ul { list-style: none; padding: 0; }
    aside li button { width: 100%; text-align: left; margin-bottom: .25rem; }
    aside li button[aria-current] { font-weight: bold; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: .2rem .4rem; text-align: left; }
    .dirty { background: #fff6cc; }
    .stale { background: #ffd6d6; }
    #status { min-height: 1.2em; }
    input.set { width: 3em; text-align: center; }
    input.set.bad { outline: 2px solid #b00; }
    .team-score { font-size: 1.4rem; font-weight: bold; }
    .side-score { display: block; font-size: 1.1rem; font-weight: bold; }
    #status.error { color: #b00; }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <label for="week">Week (Saturday)</label><br>
      <select id="week"></select>
      <p><small id="conn">connecting…</small></p>
      <ul id="teams"></ul>
    </aside>
    <main>
      <p id="status" role="status"></p>
      <div id="sheet"><p>Select a team.</p></div>
      <h2>Devices</h2>
      <p><small>Add a scoreboard by its device ID (the part after <code>tabletennis/</code> in the MQTT topic).</small></p>
      <div id="known"></div>
      <h2>Scoreboard data</h2>
      <div id="devices"></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
